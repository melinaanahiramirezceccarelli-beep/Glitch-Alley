    <title>¡Gracias! - Glitch Alley</title>

    <style>
        /* === IMPORTAR FUENTE DOCTOR GLITCH === */
        @font-face {
            font-family: 'Doctor Glitch';
            src: url('Doctor_Glitch.otf') format('opentype');
        }

        /* === ESTILOS GENERALES === */
        :root {
            --neon-cyan: #4ae2d0;
            --dark-bg: #030505;
            --text-color: #b0d4d0;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--dark-bg);
            background-image: 
                radial-gradient(circle at center, transparent 10%, #000000 100%),
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(74, 226, 208, 0.03) 2px, rgba(74, 226, 208, 0.03) 4px),
                linear-gradient(0deg, transparent 24%, rgba(74, 226, 208, 0.05) 25%, rgba(74, 226, 208, 0.05) 26%, transparent 27%, transparent 74%, rgba(74, 226, 208, 0.05) 75%, rgba(74, 226, 208, 0.05) 76%, transparent 77%, transparent),
                linear-gradient(90deg, transparent 24%, rgba(74, 226, 208, 0.05) 25%, rgba(74, 226, 208, 0.05) 26%, transparent 27%, transparent 74%, rgba(74, 226, 208, 0.05) 75%, rgba(74, 226, 208, 0.05) 76%, transparent 77%, transparent);
            background-size: 100% 100%, 100% 4px, 60px 60px, 60px 60px;
            background-attachment: fixed;
            
            color: var(--text-color);
            font-family: 'Share Tech Mono', monospace;
            
            /* CURSOR LED GLITCH */
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='36' height='36' viewBox='0 0 36 36'><path d='M4 4 L14 30 L18 20 L28 16 Z' fill='none' stroke='%234ae2d0' stroke-width='8' stroke-opacity='0.2'/><path d='M4 4 L14 30 L18 20 L28 16 Z' fill='none' stroke='%234ae2d0' stroke-width='4' stroke-opacity='0.5'/><path d='M4 4 L10 18 L9 18 L14 30 L18 20 L23 18 L23 19 L28 16 Z' fill='%234ae2d0'/></svg>"), auto;
            
            overflow-x: hidden;
            
            /* AJUSTE PARA PERMITIR SCROLL Y ACOMODAR TODO EL CONTENIDO */
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            min-height: 100vh;
            padding: 60px 20px;
            box-sizing: border-box;
        }

        a, button {
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='36' height='36' viewBox='0 0 36 36'><path d='M4 4 L14 30 L18 20 L28 16 Z' fill='none' stroke='%234ae2d0' stroke-width='8' stroke-opacity='0.2'/><path d='M4 4 L14 30 L18 20 L28 16 Z' fill='none' stroke='%234ae2d0' stroke-width='4' stroke-opacity='0.5'/><path d='M4 4 L10 18 L9 18 L14 30 L18 20 L23 18 L23 19 L28 16 Z' fill='%234ae2d0'/></svg>"), pointer;
        }

        /* === ANIMACIONES GLITCH DE FONDO === */
        .glitch-box {
            position: fixed;
            background-color: var(--neon-cyan);
            box-shadow: 0 0 12px var(--neon-cyan);
            opacity: 0;
            z-index: -1;
            animation: glitch-blink 4s infinite;
        }

        .glitch-line {
            position: fixed;
            width: 100%;
            height: 3px;
            background: rgba(74, 226, 208, 0.6);
            box-shadow: 0 0 15px rgba(74, 226, 208, 0.9);
            z-index: 50;
            opacity: 0;
            animation: scanline-glitch 7s infinite linear;
            pointer-events: none;
        }

        @keyframes glitch-blink {
            0%, 92%, 96%, 98% { opacity: 0; transform: scale(1) translateX(0); }
            93% { opacity: 0.9; transform: scale(1.2) translateX(15px); }
            97% { opacity: 0.7; transform: scale(1.5) translateX(-15px); }
            99% { opacity: 1; transform: scale(0.8) translateY(10px); }
            100% { opacity: 0; }
        }

        @keyframes scanline-glitch {
            0%, 10%, 12%, 50%, 52%, 80%, 82%, 100% { opacity: 0; }
            11% { opacity: 0.8; top: 15%; }
            51% { opacity: 0.9; top: 60%; }
            81% { opacity: 0.5; top: 85%; }
        }

        /* === TÍTULO === */
        h1 {
            font-family: 'Doctor Glitch', sans-serif;
            color: var(--neon-cyan);
            text-shadow: 0 0 15px rgba(74, 226, 208, 0.8), 0 0 30px rgba(74, 226, 208, 0.4);
            font-weight: normal;
            font-size: 6rem;
            margin: 0 0 30px 0;
            text-align: center;
            animation: slight-float 4s infinite ease-in-out;
            letter-spacing: 5px;
        }

        @keyframes slight-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* === CUADRO DE TEXTO === */
        .texto-agradecimiento {
            background: rgba(3,5,5,0.8);
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 15px rgba(74, 226, 208, 0.1);
            padding: 30px 40px;
            max-width: 800px;
            text-align: center;
            margin-bottom: 70px;
            position: relative;
        }

        .texto-agradecimiento::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 30px; height: 30px;
            border-top: 3px solid var(--neon-cyan);
            border-left: 3px solid var(--neon-cyan);
        }

        .texto-agradecimiento p {
            font-size: 1.2rem;
            line-height: 1.8;
            color: var(--text-color);
            margin: 0;
        }

        .texto-agradecimiento strong {
            color: #fff;
            text-shadow: 0 0 5px var(--neon-cyan);
        }

        /* === SECCIÓN LOGOS COMPAÑEROS === */
        .logos-companeros {
            display: flex;
            flex-wrap: wrap;
            justify-content: center; /* Sigue centrado, pero como es más ancho, se esparce más */
            gap: 35px; /* Más espacio entre los logos */
            max-width: 1200px; /* Contenedor mucho más ancho hacia los costados */
            width: 95%;
            margin-bottom: 70px;
        }

        .logo-link {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 170px; /* Logos más grandes */
            height: 120px; /* Logos más grandes */
            position: relative;
            transition: transform 0.3s ease;
        }

        .logo-link img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* Sigue garantizando que no se recorten */
            filter: drop-shadow(0 0 2px rgba(74, 226, 208, 0.1)) grayscale(50%) brightness(0.85); /* Un poquito menos grises por defecto */
            transition: all 0.3s ease;
        }

        .logo-link:hover {
            transform: translateY(-8px); /* Flota un poquito más al pasar el mouse */
            z-index: 2;
        }

        .logo-link:hover img {
            filter: drop-shadow(0 0 18px rgba(74, 226, 208, 0.8)) grayscale(0%) brightness(1.1); /* Ahora el brillo emana directo del logo */
            transform: scale(1.1);
        }

        /* === BOTÓN === */
        .btn-volver {
            display: inline-block;
            padding: 15px 40px;
            font-size: 22px;
            color: var(--neon-cyan);
            text-decoration: none;
            background-color: rgba(3,5,5,0.7);
            border: 2px solid var(--neon-cyan);
            clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
            transition: all 0.3s ease;
            letter-spacing: 2px;
            font-family: 'Doctor Glitch', sans-serif;
            margin-bottom: 40px;
        }

        .btn-volver:hover {
            background-color: var(--neon-cyan);
            color: var(--dark-bg);
            box-shadow: 0 0 35px var(--neon-cyan);
            text-shadow: none;
        }

        /* Responsivo para celulares */
        @media (max-width: 600px) {
            h1 { font-size: 3.5rem; }
            .texto-agradecimiento p { font-size: 1rem; }
            .logo-link { width: 120px; height: 90px; } /* Ajuste de tamaño para celulares */
            .btn-volver { font-size: 18px; padding: 12px 30px; }
        }
    </style>
